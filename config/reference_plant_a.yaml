# =============================================================================
# Plant Config — Reference Plant A
# =============================================================================
# Энэ файл нь Doc 03 (Plant Profile)-ийн машинд уншигдах хувилбар. Engine кодыг
# өөрчлөхгүйгээр шинэ үйлдвэрт = энэ файлыг хувилж бөглөнө (Doc 04 §1.2 зарчим 1).
#
# Утгын төлөв:
#   confirmed — Duk/үйлдвэрээс баталгаажсан
#   design    — зураг төслийн (nameplate) тоо, бодит ажлын утга биш
#   TODO      — инженерээс хүлээж буй (docs/05-plant-data-request-тай тулгана)
#
# Төлөв (2026-06-16): Инженерийн хариу + Sedgman ТЭЗҮ нэгтгэгдсэн.
# ✅ Бүх эгзэгтэй (critical) талбар бөглөгдсөн — engine бэлэн.
# Үлдсэн TODO: pump rpm хүрээ, secondary-талын зарим tag, магнетит нийлүүлэгч,
# мөн engine ажиллуулахад #1 хэрэгтэй: seam бүрийн washability raw хүснэгт.
# =============================================================================

plant:
  name: "CHPP — Coarse circuit"
  reference_name: "Reference Plant A"
  location: "Өмнөговь"           # confirmed
  owner: "MMC"                    # confirmed
  commissioned_year: 2011         # confirmed
  nameplate_capacity_tph: 900     # confirmed
  coal_types: ["coking", "thermal"]

# --- Баяжуулалтын схем (Doc 03 §2) — хоёр шатлалт DMC --------------------------
circuit:
  type: "two-stage-dmc"
  primary:
    role: "coking"
    cyclones_parallel: null       # TODO §2 — хэдэн циклон зэрэгцээ
  secondary:
    role: "thermal"
    cyclones_parallel: null       # TODO §2
  desliming_screens: null         # TODO §2
  crushers: null                  # TODO §2

# --- Циклоны геометр (Doc 03 §3) ---------------------------------------------
cyclones:
  primary:
    diameter_mm: 1300             # confirmed
    vortex_finder_mm: 670         # confirmed (дотоод диаметр баталгаажуулна — TODO §3)
    spigot_mm: 540                # confirmed
    do_dc: 0.52                   # DM циклоны жишигт нийцнэ
    du_dc: 0.42
    liner_material: "alumina"     # confirmed
    liner_thickness_mm: 25
    cone_angle_deg: 20
  secondary:
    diameter_mm: 1000
    vortex_finder_mm: 535
    spigot_mm: 400
    do_dc: 0.535
    du_dc: 0.40
    liner_material: "alumina"
    liner_thickness_mm: 25
    cone_angle_deg: 20

# --- Орчны нягт ба ажиллах хязгаар (Doc 03 §6) -------------------------------
# ЧУХАЛ: SP логик БОДИТ ажлын нягтыг ашиглана (design 1.5-ыг биш).
medium_density:
  primary:
    working_min: 1.32             # confirmed (инженер)
    working_max: 1.42             # confirmed
    typical: 1.38                 # confirmed
  secondary:
    working_min: 1.45             # confirmed
    working_max: 1.55             # confirmed
    typical: 1.50                 # confirmed
  design_medium_rd: 1.5           # design — §4 масс балансын тоо (бодит биш)
  measurement_method: "Endress+Hauser Gammapilot (gamma/nuclear), насосны гаралт дээр"  # confirmed

# --- Хагалах нягт d50 (ТЭЗҮ-ээс — Doc 06) -----------------------------------
# Орчны нягтаас ӨӨР: d50 = орчны нягт + (0.05-0.10). Engine зорилт болно.
cut_density:
  coking_d50_design: [1.40, 1.45]   # source: FS-design — коксжих хязгаар
  thermal_d50_design: 1.80          # source: FS-design — хоёрдогч захын агуулга

# --- Магнетит (Doc 03 §7) — ТЭЗҮ-ээс бараг бүрэн ----------------------------
magnetite:
  grind_p90_um: 45                # confirmed: -45µm 90%+
  grind_p98_um: 56                # source: FS — 98% < 56µm
  consumption_g_per_t: 600        # confirmed (ТЭЗҮ-тэй таарна)
  magnetic_content_pct: 97        # source: FS — 70mT-д >97%
  solid_density_t_m3: 4.9         # source: FS — >4.9 т/м³
  supplier: null                  # TODO §7 — нийлүүлэгч нэр хэвээр дутуу
  price_usd_per_t: [110, 130]     # confirmed (инженер) — хүргэгдсэн

# --- Орчны recovery (Doc 03 §8) — ТЭЗҮ-ээс -----------------------------------
medium_recovery:
  magnetic_separators:            # source: FS — MS-401/402
    count: 2
    model: "Eriez Climaxx"
    drum_dia_mm: 1200
    drum_length_mm: 2700
    capacity_m3h: 300
    motor_kw: 11
  density_tank_makeup: "manual"   # ТЭЗҮ х.83 — гар (усан буугаар) баталгаажсан
  density_control: "water-injection-at-pump-discharge"  # ТЭЗҮ х.83

# --- Насос (Doc 03 §9) -------------------------------------------------------
# VSD сүлжээ бий + SIT_104_PumpSpeed tag байгаа тул pump speed нь хэмжигддэг,
# удирдаж болох SP хувьсагч мөн (has_vfd: true). rpm хүрээ дутуу хэвээр.
pumps:
  plant_has_vsd_network: true     # confirmed
  primary:
    model: "Krebs 500кВт (FS: 16x14x39 MMD)"  # confirmed (мотор), загвар FS
    motor_kw: 500                 # confirmed
    has_vfd: true                 # confirmed (VSD сүлжээ + SIT_104_PumpSpeed tag)
    rpm_min: null                 # TODO §9 — ажлын rpm хүрээ дутуу
    rpm_max: null                 # TODO §9
  secondary:
    model: "Krebs 450кВт (FS: 14x12x36 MMD)"  # confirmed (мотор)
    motor_kw: 450                 # confirmed
    has_vfd: true                 # confirmed
    rpm_min: null                 # TODO §9
    rpm_max: null                 # TODO §9

# --- Ширхэглэлийн хүрээ (Doc 03 §5) ------------------------------------------
size_range:
  dmc_feed_mm: [1.2, 50]          # confirmed
  below_1_2mm: "TBS (-1.2+0.25) + флотаци (-0.25)"
  above_50mm_pct_limit: 5

# --- PLC холболт ба tag (Doc 03 §10) — Data Spec-ийн суурь -------------------
plc:
  brand: "Allen-Bradley ControlLogix 5570"  # confirmed
  opc_ua_available: true          # confirmed — OPC UA бий, унших боломжтой
  # confirmed tag-ууд (инженер). Дутуу tag-ийг "TODO" гэж тэмдэглэв.
  tags:
    medium_density_primary:    { measured: true, tag: "DIT_103_PrimaryDensity" }
    medium_density_secondary:  { measured: null, tag: null }   # TODO — secondary нягтын tag
    cyclone_pressure_primary:  { measured: true, tag: "PIT_102_CyclonePressure" }
    cyclone_pressure_secondary: { measured: null, tag: null }  # TODO
    feed_flow:                 { measured: true, tag: "FIT_101_MediaFlow" }  # хүнд орчны зарцуулалт
    pump_speed_vfd_primary:    { measured: true, tag: "SIT_104_PumpSpeed" }
    pump_speed_vfd_secondary:  { measured: null, tag: null }   # TODO
    pump_motor_current:        { measured: null, tag: null }   # TODO
    sump_level:                { measured: null, tag: null }   # TODO
    mag_separator_current:     { measured: null, tag: null }   # TODO
    feed_belt_weigher_tph:     { measured: null, tag: null }   # TODO
    online_ash_analyzer:       { measured: true, tag: "AIT_105_OnlineAsh" }  # ⭐ туузан дээрх онлайн үнс
    makeup_water_flow:         { measured: null, tag: null }   # TODO

# --- Бүтээгдэхүүний зорилт (Doc 03 §11) — engine-ийн target оролт ------------
# ТЭЗҮ дизайны утга (1.40 хагалах нягтад, давхаргаас хамаарна). Бодит зорилтот
# ash-ыг оператор гараар оруулна; гэрээний бүтэц нь ажиллагааны өгөгдөл.
product_targets:
  coking:
    target_ash_pct: 10.5          # confirmed — зорилтот үнс
    design_ash_range_pct: [7.2, 12.6]  # source: FS — давхарга бүрээр
    design_csn_range: [1, 8.5]    # source: FS
    other_spec: null              # TODO §11 — VM, чийг, хүхэр, фосфор (ТЭЗҮ-нд бий)
    contract:                     # confirmed — гэрээний бүтэц
      base_ash_pct: 10.0          # үндсэн үнслэг
      penalty_threshold_pct: 10.5 # >10.5% → торгууль
      penalty_usd_per_t: 1.5      # $/т
      rejection_threshold_pct: 11.5  # >11.5% → татгалзах эрхтэй
  thermal:
    target_ash_pct: 17.0          # confirmed
    design_ash_range_pct: [12.6, 29.7]  # source: FS
    calorific_value: null         # илчлэгээр биш, үнслэгээр зорьдог
    design_cv_kcal_kg: [5525, 7410]     # source: FS — давхарга бүрээр
    other_spec: null
    contract: null                # TODO §11

# --- Тоног төхөөрөмжийн элэгдлийн baseline (Doc 03 §13) — confirmed ----------
# Сэлбэгийн сануулга (Tier 2)-ийн threshold болно.
wear_baseline_hours:
  vortex_finder: [4000, 6000]     # confirmed (нүүрсний хатуулгаас хамаарна)
  spigot: [4000, 6000]            # confirmed (vortex finder-тэй хамт өгсөн)
  pump_impeller: [3000, 4500]     # confirmed
  cone_liner: [12000, 15000]      # confirmed (alumina ceramic)

# --- Ажиллах горим (Doc 03 §14) ----------------------------------------------
operating_mode: "ash-priority"    # confirmed — зорилтот ash тогтмол, yield максимумчилна

# --- Engine-ийн тохиргоо -----------------------------------------------------
engine:
  # NGM/NDM цонхны НЭГ ТАЛЫН өргөн. БАТАЛГААЖСАН (Book2 тулгалт):
  # Ухаа Худагийн лаб ±0.05 (нийт 0.10) ашигладаг → engine үүнтэй таарна.
  # ⚠ Engine нягтын цонхоор интерполяци хийдэг тул жигд бус бин дээр Book2-ын
  # бүхэл-мөр нийлбэрээс НАРИЙВЧЛАЛТАЙ (ажлын cut 1.40 дээр хоёулаа яг таарна).
  ngm_half_width: 0.05            # confirmed (Book2 ±0.05)
  # ⚠ Bird-ийн >25% хүндрэлийн жиш нь ±0.10-д тохирсон. ±0.05 конвенцоор
  # босгыг дахин тааруулах эсвэл хүндрэлийг ±0.10-аар тусад нь үнэлэх ёстой.
  # TODO: инженерээс анхааруулгын босгыг аль конвенцоор тогтоохыг баталгаажуулна.
  ngm_warn_threshold_pct: 25      # түр (±0.10 Bird жиш) — баталгаажуулна
